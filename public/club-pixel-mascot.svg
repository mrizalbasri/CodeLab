<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <title>KUBI, the Code Lab pixel mascot</title>
  <desc>KUBI is a friendly pixel mascot combining a curious cat face with long rabbit ears.</desc>

  <!-- Pixel shadow -->
  <rect x="10" y="58" width="44" height="3" fill="#111827"/>

  <!-- Long rabbit ears with a cat face -->
  <rect x="14" y="4" width="11" height="25" fill="#111827"/>
  <rect x="39" y="4" width="11" height="25" fill="#111827"/>
  <rect x="17" y="7" width="5" height="20" fill="#0047BA"/>
  <rect x="42" y="7" width="5" height="20" fill="#0047BA"/>
  <rect x="18" y="8" width="3" height="13" fill="#f8fafc"/>
  <rect x="43" y="8" width="3" height="13" fill="#f8fafc"/>

  <!-- Cat head -->
  <rect x="13" y="12" width="38" height="4" fill="#111827"/>
  <rect x="8" y="16" width="48" height="24" fill="#111827"/>
  <rect x="12" y="14" width="40" height="27" fill="#0047BA"/>
  <rect x="9" y="22" width="4" height="12" fill="#f8fafc"/>
  <rect x="51" y="22" width="4" height="12" fill="#0047BA"/>
  <rect x="16" y="36" width="32" height="6" fill="#f8fafc"/>

  <!-- Large friendly cat eyes -->
  <rect x="17" y="22" width="10" height="8" fill="#f8fafc"/>
  <rect x="37" y="22" width="10" height="8" fill="#f8fafc"/>
  <rect x="20" y="24" width="5" height="5" fill="#111827"/>
  <rect x="39" y="24" width="5" height="5" fill="#111827"/>
  <rect x="21" y="24" width="2" height="2" fill="#0047BA"/>
  <rect x="40" y="24" width="2" height="2" fill="#0047BA"/>

  <!-- Cute but clean expression -->
  <rect x="29" y="30" width="6" height="4" fill="#f8fafc"/>
  <rect x="25" y="34" width="14" height="3" fill="#111827"/>
  <rect x="29" y="36" width="6" height="2" fill="#111827"/>

  <!-- Whiskers -->
  <rect x="2" y="29" width="8" height="2" fill="#111827"/>
  <rect x="3" y="35" width="7" height="2" fill="#111827"/>
  <rect x="54" y="29" width="8" height="2" fill="#111827"/>
  <rect x="54" y="35" width="7" height="2" fill="#111827"/>

  <!-- Signature curled cat tail, clearly separated on the right -->
  <rect x="43" y="48" width="10" height="10" fill="#111827"/>
  <rect x="48" y="42" width="10" height="12" fill="#111827"/>
  <rect x="52" y="34" width="10" height="14" fill="#111827"/>
  <rect x="47" y="30" width="14" height="9" fill="#111827"/>
  <rect x="46" y="32" width="9" height="4" fill="#0047BA"/>
  <rect x="55" y="36" width="5" height="10" fill="#0047BA"/>
  <rect x="51" y="44" width="5" height="7" fill="#0047BA"/>
  <rect x="45" y="50" width="7" height="5" fill="#0047BA"/>

  <!-- Body -->
  <rect x="17" y="39" width="31" height="17" fill="#111827"/>
  <rect x="21" y="39" width="23" height="17" fill="#0047BA"/>
  <rect x="25" y="42" width="15" height="12" fill="#f8fafc"/>
  <rect x="27" y="44" width="11" height="3" fill="#0047BA"/>

  <!-- Arms holding a code badge -->
  <rect x="11" y="45" width="13" height="8" fill="#111827"/>
  <rect x="12" y="47" width="11" height="5" fill="#0047BA"/>
  <rect x="40" y="45" width="13" height="8" fill="#111827"/>
  <rect x="40" y="47" width="11" height="5" fill="#0047BA"/>

  <rect x="26" y="47" width="12" height="9" fill="#111827"/>
  <rect x="28" y="48" width="8" height="7" fill="#f8fafc"/>
  <rect x="29" y="49" width="2" height="5" fill="#111827"/>
  <rect x="33" y="49" width="2" height="5" fill="#0047BA"/>

  <!-- Feet -->
  <rect x="16" y="53" width="13" height="6" fill="#111827"/>
  <rect x="35" y="53" width="13" height="6" fill="#111827"/>
  <rect x="19" y="54" width="7" height="4" fill="#0047BA"/>
  <rect x="38" y="54" width="7" height="4" fill="#0047BA"/>
</svg>
